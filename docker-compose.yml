version: "3.8"

services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql://mafia:${DB_PASSWORD}@db:5432/mafiabot
      - NODE_ENV=production
      - LOG_LEVEL=info
    networks:
      - mafianet

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mafiabot
      - POSTGRES_USER=mafia
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafia -d mafiabot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mafianet

volumes:
  pgdata:

networks:
  mafianet:
